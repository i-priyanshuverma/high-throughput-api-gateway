version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway-octane
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - OCTANE_SERVER=swoole
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_USERS_URL=http://mock-service-users:8080
      - SERVICE_ORDERS_URL=http://mock-service-orders:8080
      - SERVICE_PRODUCTS_URL=http://mock-service-products:8080
    depends_on:
      - redis
    networks:
      - gateway-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - gateway-network
    restart: unless-stopped

  mock-service-users:
    image: python:3.11-alpine
    container_name: mock-service-users
    command: sh -c "python3 -c 'from http.server import HTTPServer, BaseHTTPRequestHandler; class H(BaseHTTPRequestHandler): do_GET = do_POST = lambda s: (s.send_response(200), s.send_header(\"Content-Type\", \"application/json\"), s.end_headers(), s.wfile.write(b\"{\\\"service\\\": \\\"users\\\", \\\"status\\\": \\\"ok\\\"}\")); HTTPServer((\"0.0.0.0\", 8080), H).serve_forever()'"
    networks:
      - gateway-network

  mock-service-orders:
    image: python:3.11-alpine
    container_name: mock-service-orders
    command: sh -c "python3 -c 'from http.server import HTTPServer, BaseHTTPRequestHandler; class H(BaseHTTPRequestHandler): do_GET = do_POST = lambda s: (s.send_response(200), s.send_header(\"Content-Type\", \"application/json\"), s.end_headers(), s.wfile.write(b\"{\\\"service\\\": \\\"orders\\\", \\\"status\\\": \\\"ok\\\"}\")); HTTPServer((\"0.0.0.0\", 8080), H).serve_forever()'"
    networks:
      - gateway-network

networks:
  gateway-network:
    driver: bridge

volumes:
  redis-data:
